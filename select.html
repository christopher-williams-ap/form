<script type="text/javascript">
  $('option').mousedown(function(e) {
    e.preventDefault();
    $(this).prop('selected', !$(this).prop('selected'));
    return false;
  });
  
  const selectElement = document.getElementById("vendor-selection");
  selectElement.addEventListener("change", (event) => {
    for (x = 0; x < selectElement.length; x++) {
      const item = document.getElementById(selectElement.options.item(x).id + "-chk");
      item.checked = selectElement.options.item(x).selected;
    }
  });
</script>
